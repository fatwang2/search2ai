# 打 tag 即发版: git tag v0.3.1 && git push origin v0.3.1
# npm 推荐配置 Trusted Publisher: fatwang2/search2ai, workflow release.yml, 允许 npm publish。
# 也兼容仓库 Secret NPM_TOKEN；未配置时使用 GitHub Actions OIDC。
name: Release

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 bundled npm may predate OIDC support (requires npm >=11.5.1).
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#[vV]}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "tag $TAG != package.json $PKG" && exit 1; fi
      - name: Publish to npm (skipped if this version is already published)
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "search2ai@$PKG" version >/dev/null 2>&1; then
            echo "search2ai@$PKG already on npm, skipping publish"
          else
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              unset NODE_AUTH_TOKEN
              npm config delete //registry.npmjs.org/:_authToken
            fi
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release (skipped if it already exists)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
