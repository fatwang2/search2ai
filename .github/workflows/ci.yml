name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install pinned compatibility SDKs
        run: npm install --prefix tests/sdk --ignore-scripts --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: Check official client SDK compatibility
        run: npm run test:sdk
      - name: Bundle check for Cloudflare Workers
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-out
